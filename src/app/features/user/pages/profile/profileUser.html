<section class="profile-container">
  <section class="profile-header">
    <div class="user-data">
      <div class="stat">
        <p class="stat-value">{{ user()?.followers?.length }}</p>
        <p class="stat-label">Seguidores</p>
      </div>

      <div class="user-center">
        <div class="avatar"></div>
        <p class="username">@{{ user()?.nickname }}</p>
      </div>

      <div class="stat">
        <p class="stat-value">{{ user()?.following?.length }}</p>
        <p class="stat-label">Seguidos</p>
      </div>
    </div>

    <div class="user-description">
      <p class="user-name">{{ user()?.name }}</p>
      <p class="user-bio">{{ user()?.description }}</p>
    </div>
  </section>

  <section class="profile-posts">
    <app-user-posts [tabs]="userTabs"></app-user-posts>
  </section>

  <section class="profile-navbar">
    <app-navbar [activeTabName]="'Profile'"></app-navbar>
  </section>
</section>
