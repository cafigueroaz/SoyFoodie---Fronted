<div class="register-container">
  @if (step === 'choose') {
  <h1>¿Qué tipo de cuenta vas a crear?</h1>
  <div class="choose">
    <button (click)="select('foodie')">Usuario</button>
    <button (click)="select('partner')">Restaurante</button>
  </div>
  } @else if (step === 'foodie') {
  <h1 class="text-title">Crear cuenta de Foodie</h1>

  <form (ngSubmit)="submitFoodie()" #foodieForm="ngForm" class="login-card">
    <div class="form-group">
      <input
        class="text-label"
        name="name"
        [(ngModel)]="name"
        required
        placeholder="Nombre completo"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="nickname"
        [(ngModel)]="nickname"
        required
        placeholder="Nombre de usuario"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="age"
        type="number"
        [(ngModel)]="age"
        required
        placeholder="Edad"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        placeholder="Correo electrónico"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        placeholder="Contraseña (mín. 8 caracteres)"
      />
    </div>

    <button
      class="btn-primary"
      type="submit"
      [disabled]="foodieForm.invalid || loading"
    >
      {{ loading ? "Creando..." : "Registrarte" }}
    </button>

    <p class="separator text-info">
      <span></span>¿Ya tienes una cuenta?<span></span>
    </p>

    <button class="btn-secondary" type="button" (click)="goToLogin()">
      Iniciar sesión
    </button>
  </form>
  } @else {
  <h1 class="text-title">Crear cuenta de Partner</h1>

  <form (ngSubmit)="submitPartner()" #partnerForm="ngForm" class="login-card">
    <div class="form-group">
      <input
        class="text-label"
        name="name"
        [(ngModel)]="name"
        required
        placeholder="Nombre del restaurante"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="nickname"
        [(ngModel)]="nickname"
        required
        placeholder="Nombre de usuario"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="address"
        [(ngModel)]="address"
        required
        placeholder="Dirección del restaurante"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="ownerName"
        [(ngModel)]="ownerName"
        required
        placeholder="Nombre del propietario"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="phone"
        type="tel"
        [(ngModel)]="phone"
        required
        placeholder="Teléfono de contacto"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="schedule"
        [(ngModel)]="schedule"
        required
        placeholder="Horario de atención (ej. 10am - 8pm)"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        placeholder="Correo electrónico"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        placeholder="Contraseña (mín. 8 caracteres)"
      />
    </div>

    <button
      class="btn-primary"
      type="submit"
      [disabled]="partnerForm.invalid || loading"
    >
      {{ loading ? "Creando..." : "Registrar empresa" }}
    </button>

    <p class="separator text-info">
      <span></span>¿Ya tienes una cuenta?<span></span>
    </p>
    <button class="btn-secondary" type="button" (click)="goToLogin()">
      Iniciar sesión
    </button>
  </form>
  }
</div>
