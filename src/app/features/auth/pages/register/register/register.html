<div class="register-container">
  @if (step === 'choose') {
  <h1>¿Qué tipo de cuenta vas a crear?</h1>
  <div class="choose">
    <button (click)="select('user')">Usuario</button>
    <button (click)="select('partner')">Restaurante / Partner</button>
  </div>
  } @else if (step === 'user') {
  <h1 class="text-title">Crear cuenta de Usuario</h1>

  <form (ngSubmit)="submitFoodie()" #userForm="ngForm" class="login-card">
    <div class="form-group">
      <div class="input-container">
        <input
          class="text-label"
          name="name"
          [(ngModel)]="name"
          required
          placeholder="Nombres"
        />
      </div>
      <div class="input-container">
        <input
          class="text-label"
          name="lastname"
          [(ngModel)]="lastname"
          required
          placeholder="Apellidos"
        />
      </div>
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="nickname"
        [(ngModel)]="nickname"
        required
        placeholder="Nombre de usuario"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="age"
        type="number"
        [(ngModel)]="age"
        required
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        placeholder="Correo electrónico"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        placeholder="Contraseña"
      />
    </div>

    <button
      class="btn-primary"
      type="submit"
      [disabled]="userForm.invalid || loading"
    >
      {{ loading ? "Creando..." : "Registrarte" }}
    </button>

    <p class="separator text-info">
      <span></span>¿Ya tienes una cuenta?<span></span>
    </p>
    <button class="btn-secondary" type="button" (click)="goToLogin()">
      Iniciar sesión
    </button>
  </form>
  } @else {
  <h1 class="text-title">Crear cuenta de Partner</h1>

  <form (ngSubmit)="submitPartner()" #partnerForm="ngForm" class="login-card">
    <div class="form-group">
      <div class="input-container">
        <input
          class="text-label"
          name="name"
          [(ngModel)]="name"
          required
          placeholder="Nombre del restaurante"
        />
      </div>
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="nickname"
        [(ngModel)]="nickname"
        required
        placeholder="Nombre de usuario"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="address"
        [(ngModel)]="address"
        required
        placeholder="Dirección"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="ownerName"
        [(ngModel)]="ownerName"
        required
        placeholder="Propietario"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="phone"
        type="tel"
        [(ngModel)]="phone"
        required
        placeholder="Teléfono"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="schedule"
        [(ngModel)]="schedule"
        required
        placeholder="Horario de atención"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        placeholder="Correo electrónico"
      />
    </div>

    <div class="form-group">
      <input
        class="text-label"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        placeholder="Contraseña"
      />
    </div>

    <button
      class="btn-primary"
      type="submit"
      [disabled]="partnerForm.invalid || loading"
    >
      {{ loading ? "Creando..." : "Registrar empresa" }}
    </button>

    <p class="separator text-info">
      <span></span>¿Ya tienes una cuenta?<span></span>
    </p>
    <button class="btn-secondary" type="button" (click)="goToLogin()">
      Iniciar sesión
    </button>
  </form>
  }
</div>
