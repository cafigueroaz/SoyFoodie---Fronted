<!-- src/app/features/posts/pages/create/create.html -->
<div class="login-container">
  <div class="title-container">
    <img
      class="back-container"
      src="./icons/back.svg"
      alt="Retroceder"
      role="button"
      tabindex="0"
      (click)="goBack()"
      (keyup.enter)="goBack()"
    />
    <h1 class="text-title">Crear publicación</h1>
  </div>

  <form (ngSubmit)="onSubmit()" #postForm="ngForm" class="login-card">
    <!-- Nombre del restaurante -->
    <div class="form-group">
      <input
        class="text-label"
        id="partner"
        name="partner"
        type="text"
        [(ngModel)]="post.partner"
        required
        placeholder="Nombre del restaurante o partner"
      />
    </div>

    <!-- Comentario -->
    <div class="form-group">
      <textarea
        class="text-label"
        id="comment"
        name="comment"
        [(ngModel)]="post.comment"
        required
        placeholder="Escribe tu reseña o comentario..."
      ></textarea>
    </div>

    <!-- Calificación -->
    <div class="form-group">
      <input
        class="text-label"
        id="rating"
        name="rating"
        type="number"
        [(ngModel)]="post.rating"
        required
        placeholder="Calificación (1 a 5)"
      />
    </div>

    <!-- Enlace multimedia -->
    <div class="form-group">
      <input
        class="text-label"
        id="mediaUrl"
        name="mediaUrl"
        type="url"
        [(ngModel)]="post.mediaUrl"
        required
        placeholder="Pega aquí el enlace del video o imagen"
      />
    </div>

    <!-- Botón -->
    <button
      class="btn-primary"
      type="submit"
      [disabled]="postForm.invalid || loading"
    >
      {{ loading ? "Publicando..." : "Publicar" }}
    </button>
  </form>
</div>

<section class="profile-navbar">
  <app-navbar [activeTabName]="'Create'"></app-navbar>
</section>
